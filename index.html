<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance & Investment Blog</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone to parse JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #065f46; /* Finance Emerald Green */
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin-top: 0;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
    }
    nav button {
      background: none;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 4px;
    }
    nav button:hover, nav button.active {
      background: rgba(255, 255, 255, 0.2);
    }
    main {
      padding: 24px 16px;
    }
    .card {
      max-width: 480px;
      margin: 20px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px #00000012;
    }
    .card h2 {
      text-align: center;
      color: #065f46;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus,
    select:focus {
      outline: 2px solid #a7f3d0;
      border-color: #059669;
    }
    small {
      display: block;
      color: #dc2626;
      margin-top: 5px;
    }
    button.submit-btn,
    .button-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
    }
    button.submit-btn {
      width: 100%;
    }
    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .success {
      color: #15803d;
      font-weight: bold;
      text-align: center;
    }
    @media (max-width: 600px) {
      .card {
        padding: 18px;
      }
      nav {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Home({ setPage }) {
      return (
        <div className="card">
          <h2>Welcome to Finance & Investment Blog</h2>
          <p>
            Learn smart investing strategies, track stock market trends, and build long-term wealth.
          </p>
          <button className="button-link" onClick={() => setPage('register')}>
            Register Now
          </button>
        </div>
      );
    }

    function Register() {
      const [form, setForm] = useState({
        name: "",
        email: "",
        password: "",
        age: "",
        mobile: "",
        gender: "",
        state: ""
      });
      const [submitted, setSubmitted] = useState(false);

      const updateField = (e) => {
        setForm({
          ...form,
          [e.target.name]: e.target.value
        });
        setSubmitted(false);
      };

      const errors = {
        name: !/^[A-Za-z ]+$/.test(form.name.trim()),
        email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email),
        password: !/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(form.password),
        age: !/^\d+$/.test(form.age) || Number(form.age) < 18 || Number(form.age) > 30,
        mobile: !/^\d{10}$/.test(form.mobile),
        gender: !form.gender,
        state: !form.state
      };

      const valid =
        form.name.trim() !== "" &&
        !errors.name &&
        !errors.email &&
        form.email !== "" &&
        !errors.password &&
        !errors.age &&
        form.age !== "" &&
        !errors.mobile &&
        !errors.gender &&
        !errors.state;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (valid) {
          setSubmitted(true);
        }
      };

      return (
        <div className="card">
          <h2>Investor Registration</h2>
          <form onSubmit={handleSubmit} noValidate>
            <label>Full Name</label>
            <input
              name="name"
              value={form.name}
              onChange={updateField}
              placeholder="Enter your name"
              required
            />
            {form.name && errors.name && (
              <small>Name must contain letters only.</small>
            )}

            <label>Email Address</label>
            <input
              name="email"
              type="email"
              value={form.email}
              onChange={updateField}
              placeholder="Enter your email"
              required
            />
            {form.email && errors.email && (
              <small>Enter a valid email address.</small>
            )}

            <label>Password</label>
            <input
              name="password"
              type="password"
              value={form.password}
              onChange={updateField}
              placeholder="Minimum 8 characters"
              required
            />
            {form.password && errors.password && (
              <small>
                Use uppercase, lowercase, a number and at least 8 characters.
              </small>
            )}

            <label>Age</label>
            <input
              name="age"
              type="number"
              value={form.age}
              onChange={updateField}
              placeholder="Enter age (18–30)"
              required
            />
            {form.age && errors.age && (
              <small>Age must be between 18 and 30.</small>
            )}

            <label>Mobile Number</label>
            <input
              name="mobile"
              type="tel"
              value={form.mobile}
              onChange={updateField}
              placeholder="10-digit mobile number"
              required
            />
            {form.mobile && errors.mobile && (
              <small>Enter exactly 10 digits.</small>
            )}

            <label>Gender</label>
            <select
              name="gender"
              value={form.gender}
              onChange={updateField}
              required
            >
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            {form.gender === ""}

            <label>State</label>
            <select
              name="state"
              value={form.state}
              onChange={updateField}
              required
            >
              <option value="">Select state</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Kerala">Kerala</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
            </select>
            {form.state === ""}

            <button type="submit" className="submit-btn" disabled={!valid}>
              Submit Registration
            </button>
            {submitted && (
              <p className="success">
                Registration completed successfully!
              </p>
            )}
          </form>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('home');

      return (
        <div>
          <header>
            <h1>Finance & Investment Blog</h1>
            <nav>
              <button 
                className={page === 'home' ? 'active' : ''} 
                onClick={() => setPage('home')}
              >
                Home
              </button>
              <button 
                className={page === 'register' ? 'active' : ''} 
                onClick={() => setPage('register')}
              >
                Registration
              </button>
            </nav>
          </header>
          <main>
            {page === 'home' ? <Home setPage={setPage} /> : <Register />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
