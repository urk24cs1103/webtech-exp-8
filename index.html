<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My React App</title>
    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <!-- Load Babel so the browser understands JSX -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // Your React component goes here
        function App() {
            return (
                <div style={{ textAlign: 'center', marginTop: '50px', fontFamily: 'Arial' }}>
                    <h1>Hello from React!</h1>
                    <p>This is running entirely inside a single HTML file.</p>
                </div>
            );
        }

        // Render the component into the root div
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
